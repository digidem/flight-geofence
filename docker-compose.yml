services:
  flight-monitor:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
    - .env
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080
    volumes:
    - flight_monitor_data:/data/runtime
    - boundary_downloads:/data/downloads
    read_only: true
    tmpfs:
    - /tmp:size=512m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',
        timeout=4)
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 256
  caddy:
    image: caddy:2.11.4-alpine
    profiles:
    - public
    restart: unless-stopped
    depends_on:
      flight-monitor:
        condition: service_healthy
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  permissions:
    build:
      context: .
    profiles:
    - maintenance
    user: 0:0
    entrypoint:
    - sh
    - -c
    - chown -R 10001:10001 /data/runtime /data/downloads
    volumes:
    - flight_monitor_data:/data/runtime
    - boundary_downloads:/data/downloads
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
volumes:
  flight_monitor_data: {}
  boundary_downloads: {}
  caddy_data: {}
  caddy_config: {}
