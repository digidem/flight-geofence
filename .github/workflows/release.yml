name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match v<MAJOR>.<MINOR>.<PATCH> (e.g. v0.5.0)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Changes since ${PREV_TAG}"
          else
            RANGE="HEAD"
            HEADER="Initial release"
          fi

          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIMITER}"
            echo "## ${HEADER}"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:"- %s" --reverse
            echo ""
            echo ""
            echo "---"
            echo "Docker image: \`communityfirst/flight-geofence:${VERSION}\`"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute version strings
        id: versions
        run: |
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.bare }}
          tags: |
            communityfirst/flight-geofence:${{ steps.versions.outputs.tag }}
            communityfirst/flight-geofence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
