[project]
name = "flight-geofence"
version = "0.4.0"
description = "Detects probable aircraft stops and position loss inside selected protected areas in northern Brazil"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.2",
    "uvicorn[standard]==0.48.0",
    "httpx==0.28.1",
    "shapely==2.1.2",
    "pydantic-settings==2.14.1",
    "cryptography==46.0.4",
    "geopandas==1.1.2",
    "pyogrio==0.12.1",
    "pyproj==3.7.2",
    "pandas==2.2.3",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "fr24_sandbox: live Flightradar24 sandbox tests (opt-in: FR24_SANDBOX_API_KEY for the client contract tests, FR24_SANDBOX_BASE_URL + FR24_SANDBOX_ADMIN_PASSWORD for the compose-stack ones; see FLIGHTRADAR_API.md 'Sandbox tests')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
